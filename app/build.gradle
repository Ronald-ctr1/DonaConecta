plugins {
    id 'com.android.application'
}

// Las credenciales salen de local.properties (local) o de variables de entorno (CI). Nunca del código.
def propiedades = new Properties()
def archivoLocal = rootProject.file('local.properties')
if (archivoLocal.exists()) { archivoLocal.withInputStream { propiedades.load(it) } }
def urlSupabase   = propiedades.getProperty('SUPABASE_URL')      ?: System.getenv('SUPABASE_URL')      ?: ''
def claveSupabase = propiedades.getProperty('SUPABASE_ANON_KEY') ?: System.getenv('SUPABASE_ANON_KEY') ?: ''

android {
    namespace 'com.donaconecta.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.donaconecta.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'SUPABASE_URL',      "\"${urlSupabase}\""
        buildConfigField 'String', 'SUPABASE_ANON_KEY', "\"${claveSupabase}\""
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'junit:junit:4.13.2'
}
